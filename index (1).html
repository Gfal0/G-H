<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel e Helena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Gloock&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#150f1a;
    --plum:#22172b;
    --wine:#3a1d33;
    --rose:#f08aa0;
    --gold:#ecc88f;
    --text:#f6ece7;
    --muted:#b9a8b4;
    --display:'Gloock','Georgia',serif;
    --body:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--night);color:var(--text);font-family:var(--body);line-height:1.6;overflow-x:hidden;
    background-image:radial-gradient(60rem 30rem at 50% -10%,#3a1d3366,transparent 70%)}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .wrap{width:min(100% - 32px,64rem);margin-inline:auto}

  /* ---------- Cabeçalho ---------- */
  header{padding:clamp(40px,9vw,88px) 0 28px;text-align:center}
  header h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,9vw,5.6rem);line-height:1.02}
  header p{color:var(--muted);margin-top:12px;font-size:1.05rem}

  /* ---------- Correnteza de fotos ---------- */
  .river{position:relative;overflow:hidden;padding:14px 0}
  .river::before,.river::after{content:"";position:absolute;top:0;bottom:0;width:9%;z-index:2;pointer-events:none}
  .river::before{left:0;background:linear-gradient(90deg,var(--night),transparent)}
  .river::after{right:0;background:linear-gradient(270deg,var(--night),transparent)}
  .river{touch-action:pan-y}
  .track{position:relative;width:100%}
  .card{position:absolute;left:0;top:10px;height:clamp(200px,32vw,320px);border-radius:18px;overflow:hidden;border:0;padding:0;background:var(--plum);
    box-shadow:0 14px 34px #0009;-webkit-tap-highlight-color:transparent}
  .track.b .card{height:clamp(150px,24vw,230px)}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card.ph{display:grid;place-items:center;font-size:3rem;color:var(--rose);background:linear-gradient(145deg,var(--wine),var(--plum))}

  /* ---------- Contador ---------- */
  .counter{text-align:center;padding:clamp(48px,9vw,96px) 0 24px}
  .counter .small{color:var(--muted);font-size:1.05rem}
  .counter h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6.4vw,4.4rem);line-height:1.18;margin:10px auto 14px;max-width:18ch}
  .counter h2 b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
  .tick{font-variant-numeric:tabular-nums;color:var(--rose);font-weight:500;font-size:1.15rem}

  /* ---------- Seções ---------- */
  section.block{padding:clamp(40px,7vw,72px) 0}
  section.block h3{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.5rem);margin-bottom:22px}

  .miles{list-style:none;border-top:1px solid #ffffff1f}
  .miles li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:18px 4px;border-bottom:1px solid #ffffff1f}
  .miles .what{font-size:1.15rem}
  .miles .when{color:var(--muted);font-size:.95rem}
  .miles .left{color:var(--gold);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

  .reasons{list-style:none;columns:2 18rem;column-gap:48px}
  .reasons li{break-inside:avoid;padding:0 0 18px 28px;position:relative;font-size:1.08rem}
  .reasons li::before{content:"♥";position:absolute;left:0;top:0;color:var(--rose)}

  .letter{max-width:38rem;margin-inline:auto;background:linear-gradient(160deg,var(--plum),var(--wine));border-radius:22px;padding:clamp(24px,5vw,48px);box-shadow:0 18px 44px #0008}
  .letter p{font-family:var(--display);font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.6;margin-bottom:16px}
  .letter p:last-child{margin:0;color:var(--rose)}

  footer{text-align:center;padding:48px 0 80px;color:var(--muted)}
  .love{background:var(--rose);color:#2a0f1b;border:0;border-radius:999px;padding:14px 30px;font-weight:600;font-size:1.05rem;margin-bottom:24px;box-shadow:0 8px 30px #f08aa044}
  .love:active{transform:scale(.96)}
  #uniao{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;opacity:0;background:#150f1ab8}
  #uniao.on{animation:fundo 4.2s ease forwards}
  #uniao svg{position:absolute;width:min(34vw,170px);height:auto;filter:drop-shadow(0 10px 30px #0008)}
  #uniao .vermelho{fill:#e0314b}
  #uniao .azul{fill:#2f7bf5}
  #uniao .roxo{fill:#8f4fe0;opacity:0}
  #uniao.on .vermelho{animation:vem-esq 4.2s cubic-bezier(.5,0,.3,1) forwards}
  #uniao.on .azul{animation:vem-dir 4.2s cubic-bezier(.5,0,.3,1) forwards}
  #uniao.on .roxo{animation:vira 4.2s ease forwards}
  @keyframes fundo{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{opacity:0}}
  @keyframes vem-esq{0%{transform:translateX(-60vw) rotate(-18deg) scale(.7);opacity:0}15%{opacity:1}
    55%{transform:translateX(-4%) rotate(0) scale(1);opacity:1}62%{transform:translateX(0) scale(1.05);opacity:0}100%{opacity:0}}
  @keyframes vem-dir{0%{transform:translateX(60vw) rotate(18deg) scale(.7);opacity:0}15%{opacity:1}
    55%{transform:translateX(4%) rotate(0) scale(1);opacity:1}62%{transform:translateX(0) scale(1.05);opacity:0}100%{opacity:0}}
  @keyframes vira{0%,54%{transform:scale(.5);opacity:0}62%{transform:scale(1.25);opacity:1}
    72%{transform:scale(1)}82%{transform:scale(1.18)}90%{transform:scale(1);opacity:1}100%{transform:scale(1.05);opacity:0}}
  .float-heart{position:fixed;bottom:90px;font-size:1.8rem;pointer-events:none;z-index:40;animation:up 1.8s ease-out forwards}
  @keyframes up{to{transform:translateY(-55vh) rotate(var(--r,10deg));opacity:0}}

  /* ---------- Lightbox ---------- */
  #lb{position:fixed;inset:0;z-index:80;background:#0d0810f2;display:none;place-items:center;padding:16px}
  #lb.on{display:grid}
  #lb img{max-width:100%;max-height:88vh;border-radius:14px}
  #lb button{position:absolute;background:#ffffff1a;border:0;border-radius:999px;width:48px;height:48px;font-size:1.4rem}
  #lb .x{top:16px;right:16px}#lb .p{left:12px;top:50%}#lb .n{right:12px;top:50%}

  @media (prefers-reduced-motion:reduce){
    .river::before,.river::after{display:none}
    .float-heart{animation-duration:.01s}
    #uniao.on{animation-duration:2s}
    #uniao.on .vermelho,#uniao.on .azul{animation:none;opacity:0}
    #uniao.on .roxo{animation:none;opacity:1}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<!-- ======= SITE ======= -->
<header>
  <div class="wrap">
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </div>
</header>

<main>
  <div class="river" id="riverA" aria-label="Fotos nossas passando"><div class="track" id="trackA"></div></div>
  <div class="river" id="riverB" aria-hidden="true"><div class="track b" id="trackB"></div></div>

  <div class="counter wrap">
    <p class="small">Desde <span id="desde"></span></p>
    <h2 id="tempo"></h2>
    <p class="tick" id="relogio"></p>
  </div>

  <section class="block wrap">
    <h3>Próximas datas nossas</h3>
    <ul class="miles" id="miles"></ul>
  </section>

  <section class="block wrap">
    <h3 id="motivosTitulo"></h3>
    <ul class="reasons" id="motivos"></ul>
  </section>

  <section class="block wrap">
    <div class="letter" id="carta"></div>
  </section>
</main>

<footer>
  <button class="love" id="love">Eu te amo</button>
  <p id="rodape"></p>
</footer>

<div id="uniao" aria-hidden="true">
  <svg class="vermelho" viewBox="0 0 32 30"><path d="M16 28C16 28 2 19 2 10C2 5 5.5 2 9.5 2C12.5 2 14.8 3.6 16 6C17.2 3.6 19.5 2 22.5 2C26.5 2 30 5 30 10C30 19 16 28 16 28Z"/></svg>
  <svg class="azul" viewBox="0 0 32 30"><path d="M16 28C16 28 2 19 2 10C2 5 5.5 2 9.5 2C12.5 2 14.8 3.6 16 6C17.2 3.6 19.5 2 22.5 2C26.5 2 30 5 30 10C30 19 16 28 16 28Z"/></svg>
  <svg class="roxo" viewBox="0 0 32 30"><path d="M16 28C16 28 2 19 2 10C2 5 5.5 2 9.5 2C12.5 2 14.8 3.6 16 6C17.2 3.6 19.5 2 22.5 2C26.5 2 30 5 30 10C30 19 16 28 16 28Z"/></svg>
</div>

<div id="lb" role="dialog" aria-label="Foto ampliada">
  <button class="x" aria-label="Fechar">✕</button>
  <button class="p" aria-label="Foto anterior">‹</button>
  <img alt="">
  <button class="n" aria-label="Próxima foto">›</button>
</div>

<script>
/* =====================================================
   CONFIGURAÇÃO — edite aqui. O resto não precisa mexer.
   ===================================================== */
const CONFIG = {
  titulo: "Gabriel & Helena",
  subtitulo: "Nossa história começa a ser contada hoje.",
  // Data de início (ano, mês, dia). Mês começa em 0: janeiro = 0, outubro = 9.
  inicio: { ano: 2026, mes: 9, dia: 24 },
  // Até quantas fotos procurar (1.jpg, 2.jpg, 3.jpg ...; as miniaturas são m1.jpg, m2.jpg ...)
  // Pasta das fotos. Deixe vazio ("") se as fotos estão ao lado do index.html.
  pasta: "",
  totalFotos: 100,
  extensao: "jpg",
  motivosTitulo: "Por que eu te escolho",
  motivos: [
    "Seu sorriso muda o meu dia inteiro.",
    "Você me faz rir até nos dias ruins.",
    "Com você, até fila de loja vira programa bom.",
    "Você tem um jeito de cuidar que eu admiro.",
    "Ficar perto de você é fácil.",
    "Eu quero ver o que vem depois, do seu lado."
  ],
  carta: [
    "Helena, eu poderia ter feito isso de mil jeitos, mas queria um que ficasse guardado para sempre.",
    "Cada foto que passa ali em cima é um dia que eu não trocaria por nada. E esse contador aqui embaixo é a promessa de que a gente vai continuar somando.",
    "Obrigado por ser você.",
    "Com amor, Gabriel."
  ],
  rodape: "Feito com carinho, para você, Helena."
};

/* ================== utilidades ================== */
const $ = id => document.getElementById(id);
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const inicio = new Date(CONFIG.inicio.ano, CONFIG.inicio.mes, CONFIG.inicio.dia, 0, 0, 0);
const fmtData = d => `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

$("titulo").textContent = CONFIG.titulo;
$("subtitulo").textContent = CONFIG.subtitulo;
$("desde").textContent = fmtData(inicio);
$("motivosTitulo").textContent = CONFIG.motivosTitulo;
$("rodape").textContent = CONFIG.rodape;
CONFIG.motivos.forEach(t => { const li = document.createElement("li"); li.textContent = t; $("motivos").appendChild(li); });
CONFIG.carta.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("carta").appendChild(p); });

/* ================== contador ================== */
function addMeses(d, n){ return new Date(d.getFullYear(), d.getMonth() + n, d.getDate(), 0, 0, 0); }

function atualizar(){
  const agora = new Date();
  if (agora < inicio){ $("tempo").textContent = "Nossa história começa em breve."; $("relogio").textContent = ""; return; }
  let m = (agora.getFullYear() - inicio.getFullYear()) * 12 + (agora.getMonth() - inicio.getMonth());
  if (addMeses(inicio, m) > agora) m--;
  const ancora = addMeses(inicio, m);
  const resto = agora - ancora;
  const diasTotal = Math.floor(resto / 86400000);
  const semanas = Math.floor(diasTotal / 7);
  const dias = diasTotal % 7;
  const s = Math.floor(resto / 1000) % 60;
  const mi = Math.floor(resto / 60000) % 60;
  const h = Math.floor(resto / 3600000) % 24;

  const h2 = $("tempo");
  if (m === 0 && semanas === 0 && dias === 0){
    h2.textContent = "Namorando desde hoje.";
  } else {
    h2.innerHTML = `Namorando há <b>${plural(m,"mês","meses")}</b>, <b>${plural(semanas,"semana","semanas")}</b> e <b>${plural(dias,"dia","dias")}</b>`;
  }
  $("relogio").textContent = `${h}h ${String(mi).padStart(2,"0")}min ${String(s).padStart(2,"0")}s`;
}
atualizar(); setInterval(atualizar, 1000);

/* ================== próximas datas ================== */
(function(){
  const agora = new Date();
  const metas = [
    { n: 1, t: "1 mês juntos" }, { n: 3, t: "3 meses juntos" },
    { n: 6, t: "6 meses juntos" }, { n: 12, t: "1 ano juntos" }
  ];
  metas.forEach(m => {
    const d = addMeses(inicio, m.n);
    const falta = Math.ceil((d - agora) / 86400000);
    const li = document.createElement("li");
    li.innerHTML = `<div><div class="what"></div><div class="when"></div></div><div class="left"></div>`;
    li.querySelector(".what").textContent = m.t;
    li.querySelector(".when").textContent = fmtData(d);
    li.querySelector(".left").textContent = falta > 1 ? `faltam ${falta} dias` : falta === 1 ? "amanhã" : falta === 0 ? "hoje" : "já chegamos";
    $("miles").appendChild(li);
  });
})();

/* ================== fotos ================== */
const fotos = [];           // {src, w, h}

function dimensoes(src){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res({ src, w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => res(null);
    im.src = src;
  });
}
/* ---- correnteza: animada por JS, só poucas camadas pequenas (evita falha de desenho no iPhone) ---- */
const rios = [];
const GAP = 18;

function criarCard(rio, f, idx){
  const b = document.createElement("button");
  b.className = "card" + (f && f.w > f.h ? " wide" : "");
  b._ratio = f && f.w > f.h ? 4 / 3 : 3 / 4;
  if (f){
    const img = document.createElement("img");
    img.src = f.thumb || f.src; img.alt = "Foto nossa"; img.decoding = "async"; img.draggable = false;
    b.appendChild(img);
    b.addEventListener("click", () => abrir(f));
  } else { b.classList.add("ph"); b.textContent = "♥"; b.tabIndex = -1; }
  rio.el.appendChild(b);
  rio.cards.push({ el: b, rot: [-1.4, 1.1, 0][idx % 3], dy: idx % 3 === 1 ? 8 : 0 });
}

function medirRio(rio){
  const vw = rio.box.clientWidth || window.innerWidth;
  let tentativas = 0;
  for(;;){
    let x = 0, maxW = 0, maxH = 0;
    rio.pos = [];
    rio.cards.forEach(c => {
      const h = parseFloat(getComputedStyle(c.el).height);
      const w = Math.round(h * c.el._ratio);
      c.el.style.width = w + "px";
      rio.pos.push(x); x += w + GAP; maxW = Math.max(maxW, w); maxH = Math.max(maxH, h);
    });
    rio.W = x; rio.maxW = maxW;
    rio.el.style.height = (maxH + 36) + "px";
    if (x >= vw + maxW + GAP || tentativas++ > 6) break;
    rio.itens.forEach((f, i) => criarCard(rio, f, rio.cards.length + i)); // poucas fotos: repete a sequência
  }
  if (!rio.iniciado){ rio.offset = rio.W * rio.inicio; rio.iniciado = true; }
}

function criarRio(box, itens, inicio, vel, baixo){
  const el = box.querySelector(".track");
  el.innerHTML = "";
  const rio = { box, el, itens, inicio, vel, cards: [], pos: [], offset: 0, W: 0, maxW: 0, pausa: false };
  itens.forEach((f, i) => criarCard(rio, f, i));
  medirRio(rio);
  const pausar = () => { rio.pausa = true; };
  const soltar = e => { if (e.pointerType !== "mouse") rio.pausa = false; };
  box.addEventListener("pointerdown", pausar);
  box.addEventListener("pointerup", soltar);
  box.addEventListener("pointercancel", soltar);
  box.addEventListener("pointerleave", () => { rio.pausa = false; });
  box.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") rio.pausa = true; });
  return rio;
}

let ultimoQuadro = 0;
const menosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function quadro(t){
  const dt = Math.min(0.05, (t - ultimoQuadro) / 1000); ultimoQuadro = t;
  rios.forEach(r => {
    if (!r.W) return;
    if (!r.pausa && !menosMovimento) r.offset = (r.offset + r.vel * dt) % r.W;
    r.cards.forEach((c, i) => {
      const px = (((r.pos[i] - r.offset) % r.W) + r.W) % r.W - r.maxW;
      c.el.style.transform = `translate3d(${px.toFixed(1)}px,${c.dy}px,0) rotate(${c.rot}deg)`;
    });
  });
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
window.addEventListener("resize", () => rios.forEach(medirRio));

function desenhar(){
  const itens = fotos.length ? fotos : Array(8).fill(null);
  rios.length = 0;
  rios.push(criarRio($("riverA"), itens, 0, 55, false));
  rios.push(criarRio($("riverB"), itens, 0.5, 36, true));
}

async function buscarFoto(i, base){
  const grande = `${base}${i}.${CONFIG.extensao}`;
  const t = await dimensoes(`${base}m${i}.${CONFIG.extensao}`) || await dimensoes(grande);
  return t ? { src: grande, thumb: t.src, w: t.w, h: t.h } : null;
}

async function carregar(){
  const base = CONFIG.pasta ? CONFIG.pasta.replace(/\/?$/, "/") : "";
  let desenhou = false;
  for (let ini = 1; ini <= CONFIG.totalFotos; ini += 10){
    const lote = [];
    for (let i = ini; i < ini + 10 && i <= CONFIG.totalFotos; i++) lote.push(buscarFoto(i, base));
    const achadas = (await Promise.all(lote)).filter(Boolean);
    if (!achadas.length) break;               // acabaram as fotos
    fotos.push(...achadas);
    if (!desenhou){ desenhar(); desenhou = true; }
    else desenhar();
  }
  if (!desenhou) desenhar();                   // sem fotos: mostra corações
}
desenhar();
carregar();

/* ================== lightbox ================== */
let atual = 0;
const lb = $("lb"), lbImg = lb.querySelector("img");
function mostrar(){ lbImg.src = fotos[atual].src; }
function abrir(f){ atual = Math.max(0, fotos.indexOf(f)); mostrar(); lb.classList.add("on"); }
function fechar(){ lb.classList.remove("on"); }
function passar(d){ if(!fotos.length) return; atual = (atual + d + fotos.length) % fotos.length; mostrar(); }
lb.querySelector(".x").onclick = fechar;
lb.querySelector(".p").onclick = () => passar(-1);
lb.querySelector(".n").onclick = () => passar(1);
lb.addEventListener("click", e => { if (e.target === lb) fechar(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") fechar();
  if (e.key === "ArrowLeft") passar(-1);
  if (e.key === "ArrowRight") passar(1);
});

/* ================== botão "Eu te amo" ================== */
$("love").addEventListener("click", () => {
  const u = $("uniao"), b = $("love");
  if (u.classList.contains("on")) return;
  b.disabled = true;
  u.classList.add("on");
  const chuva = () => {
    for (let i = 0; i < 9; i++){
      const h = document.createElement("span");
      h.className = "float-heart"; h.textContent = "💜";
      h.style.left = (window.innerWidth / 2 + (Math.random() - .5) * 260) + "px";
      h.style.bottom = (window.innerHeight * .38) + "px";
      h.style.setProperty("--r", (Math.random() * 50 - 25) + "deg");
      h.style.animationDelay = (i * 90) + "ms";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 2600);
    }
  };
  setTimeout(chuva, 2500);
  setTimeout(() => { u.classList.remove("on"); b.disabled = false; }, 4300);
});

</script>
</body>
</html>
